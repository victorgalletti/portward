[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "ui/src-tauri"]

[workspace.package]
version = "0.5.3"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
